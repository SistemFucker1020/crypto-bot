# Держит сервис на Render живым.
#
# Бесплатный тариф Render засыпает после 15 минут без входящего трафика:
# процесс встаёт вместе с фоновой автопроверкой рынка, и бот перестаёт
# отвечать на команды Telegram. Пинг каждые 5 минут не даёт этому случиться —
# запас против обычной для GitHub задержки запуска расписания.
#
# Если сервис не отвечает или /health отдаёт 503 (автопроверка умерла) —
# job падает, GitHub присылает письмо.

name: Держать бота живым

permissions:
  contents: read   # пингу не нужен доступ ни к чему, кроме самого репозитория

on:
  schedule:
    - cron: "*/5 * * * *"
    # Второе расписание со сдвигом на 2 минуты: GitHub считает каждую
    # строку отдельным планом, поэтому при задержке одного другой всё
    # равно придёт. Без сдвига худший промежуток — 10+ минут плюс
    # задержка, а Render засыпает уже через 15.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:   # ручной запуск: Actions → Держать бота живым → Run
  # Диагностика: если расписание молчит, этот триггер показывает, работают
  # ли Actions вообще. Срабатывает только на правку самого workflow.
  push:
    branches: [main]
    paths: [".github/workflows/keep-alive.yml"]

jobs:
  ping:
    runs-on: ubuntu-latest
    # Худший случай внутри job'а: 5 попыток по --max-time 90 + четыре
    # паузы по 20 с ≈ 8,5 мин. При старом лимите в 5 мин job резали
    # посреди пробуждения — Render не успевал подняться.
    timeout-minutes: 10
    steps:
      - name: Разбудить сервис на Render
        run: |
          url="https://crypto-bot-im58.onrender.com/health"
          echo "Пингую $url"
          code="000"
          # Холодный старт на Render занимает около минуты — пробуем пять раз.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
                     --max-time 90 "$url" || echo "000")
            echo "попытка $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 20
          done
          echo "Ответ: $(head -c 300 /tmp/response.txt)"
          # 404 — на сервере ещё прошлая версия без /health: это не авария,
          # иначе каждые пять минут валился бы job и сыпались письма.
          if [ "$code" = "404" ]; then
            echo "::warning::Старая версия без /health — задеплой последний коммит, тогда проверка оживёт."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Сервис мёртв или автопроверка встала: HTTP $code — Render: статус и логи, потом /start в боте."
            exit 1
          fi
