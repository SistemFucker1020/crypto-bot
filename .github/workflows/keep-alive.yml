# Держит сервис на Render живым.
#
# Бесплатный тариф Render засыпает после 15 минут без входящего трафика:
# процесс встаёт вместе с фоновой автопроверкой рынка, и бот перестаёт
# отвечать на команды Telegram. Пинг каждые 10 минут не даёт этому случиться.
#
# Если сервис всё же не отвечает — job падает, GitHub присылает письмо.

name: Держать бота живым

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:   # ручной запуск: Actions → Держать бота живым → Run

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Разбудить сервис на Render
        run: |
          url="https://crypto-bot-im58.onrender.com/"
          echo "Пингую $url"
          code="000"
          # Холодный старт на Render занимает около минуты — пробуем пять раз.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
                     --max-time 90 "$url" || echo "000")
            echo "попытка $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 20
          done
          echo "Ответ: $(head -c 200 /tmp/response.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Сервис не отвечает: HTTP $code — зайди в Render, посмотри статус и лимиты."
            exit 1
          fi
